name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-hosted.txt
      - run: python -m pip install -r requirements-hosted.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: python -m compileall -q home_agent
  saathi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saathi
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: saathi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saathi -d saathi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAATHI_TEST_POSTGRES_URL: postgresql+psycopg://saathi:synthetic-test-only@127.0.0.1:5432/saathi_test
      SAATHI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      WHATSAPP_PRODUCTION_ELIGIBLE: 'false'
      SAATHI_LIVE_ACTIONS_ENABLED: 'false'
      SAATHI_LIVE_SPEECH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-saathi-dev.txt
      - run: python -m pip install -r requirements-saathi-dev.txt
      - run: python -m pytest saathi_tests -q
      - run: node --check saathi_web/app.js
      - run: node --check saathi_web/media.js
      - run: python -m compileall -q saathi
      - run: docker build -f Saathi.Dockerfile -t saathi-phase1-ci .
      - run: docker run -d --name saathi-phase1-ci --publish 127.0.0.1:8781:8781 saathi-phase1-ci
      - run: curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8781/health/ready
      - if: failure()
        run: docker logs --tail 80 saathi-phase1-ci || true
      - if: always()
        run: docker rm -f saathi-phase1-ci || true
